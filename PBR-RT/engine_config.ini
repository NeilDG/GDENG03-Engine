# Anito Engine Configuration File
# This file can be easily modified by users and AI agents for testing purposes

[Runtime]
# Maximum runtime in seconds (0 = run indefinitely until window is closed)
# Set this to a positive number to automatically exit after X seconds
# Examples: 
#   10  = Run for 10 seconds then exit
#   30  = Run for 30 seconds then exit
#   0   = Run indefinitely (default behavior)
MaxRuntimeSeconds = 15

# Progress feedback interval in seconds while runtime limit is active
# Set to 0 to disable periodic runtime progress logs
# Examples:
#   1.0 = Print progress every second
#   5.0 = Print progress every 5 seconds
#   0   = Disable progress feedback
RuntimeFeedbackIntervalSeconds = 1.0

[Debug]
# Enable verbose logging
VerboseLogging = true

# Frame capture settings are configured in code (AnitoFrameCaptureRecorder)
# but can be referenced here for documentation
FrameCaptureInterval = 1.0

[Renderer]
# Phase 6 Step 2: BRDF mode toggle
# false = Legacy deferred BRDF path
# true  = Advanced BRDF path (Cook-Torrance rollout)
UseAdvancedBRDF = false

[Benchmark]
# Enable benchmark mode (Phase 3, Step 12)
# When enabled, the engine will run automated performance tests and exit
# Set to true to run benchmarks, false for normal operation
EnableBenchmarkMode = false

# Benchmark duration preset: Quick, Standard, Extended
# Quick: 30s per test (for rapid iteration)
# Standard: 60s per test (default, recommended)
# Extended: 120s per test (for comprehensive profiling)
BenchmarkDuration = Quick

